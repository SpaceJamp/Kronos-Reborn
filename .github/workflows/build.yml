name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The SDK version comes from global.json rather than from a loose "10.0.x" here.
      #
      # A floating version means the SDK can change under the repository between two runs, and
      # `dotnet format` ships with the SDK: a version whose formatting rules differ would rewrite
      # files and fail this build even though nothing in the commit changed. Reading the pinned
      # version keeps local runs and CI on the same tool.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # No -r / --runtime on any command below.
      #
      # RuntimeIdentifier is declared in Directory.Build.props, so it already applies to every project.
      # Passing it again at solution level fails the build outright:
      #
      #   error NETSDK1134: Building a solution with a specific RuntimeIdentifier is not supported.
      #   If you would like to publish for a single RID, specify the RID at the individual project
      #   level instead.
      #
      # Verified both ways: with -r the solution build fails, without it the output still lands in
      # bin\Release\net10.0-windows\win-x64.

      # Restore in locked mode before building anything.
      #
      # A plain restore updates packages.lock.json instead of failing, so without this the lock would
      # drift on whichever machine built last and a broken package reference would only surface as an
      # unrelated build error much later. --locked-mode fails immediately and says what is wrong.
      #
      # The restore also runs the NuGet audit configured in Directory.Build.props, with mode "all" so
      # transitive packages are covered. Findings come back as warnings on purpose: a transitive
      # advisory inside a package that cannot be updated here should not be able to block every
      # build, because that is how a guard gets switched off. They are worth reading in this log.
      - name: Restore with the committed dependency lock
        run: dotnet restore KronosReborn.sln --locked-mode

      # The build treats warnings as errors, so the build step below is also what keeps compiler and
      # analyzer findings out. This is a separate check because dotnet format notices things the
      # compiler does not, and a repository whose formatting drifts is one where real diffs get lost
      # in the noise.
      #
      # Before the build, deliberately. Building a WPF project leaves a temporary project behind in
      # the source tree, and the formatter then has an extra project to read that is not part of the
      # repository.
      - name: Check formatting
        run: dotnet format KronosReborn.sln --verify-no-changes --verbosity minimal

      - name: Build (x64)
        run: dotnet build KronosReborn.sln -c Release --no-restore

      # Only one architecture is built and tested. ARM64 was supported here and has been taken out
      # again for now, so this is the whole build matrix rather than the x64 half of it.
      #
      # Tests are architecture independent by construction anyway: the test project deliberately does
      # not reference WPF, so there is nothing in it that would behave differently elsewhere.
      #
      # dotnet run rather than dotnet test, because `dotnet test` reports "Zero tests ran" against
      # xUnit v4's in-process console runner on this SDK. The same tests pass when the test
      # executable runs, which is what this does. Reason recorded in the test project file.

      - name: Test
        run: dotnet run --project .\tests\KronosReborn.Tests -c Release --no-build

      # Each packaging script reports the exact path it produced. The workflow never spells a
      # filename itself.
      #
      # It used to glob package\Output\Kronos-*-portable.zip, which cannot match
      # KronosReborn-0.1.0-portable.zip, and it also asked for an installer that only package.cmd
      # builds, so the upload step failed on both counts. The name was duplicated here even though
      # config.cmd is documented as the single source for it, and a rename broke the one place that
      # could not see config.cmd. Reading the paths back out removes that duplication rather than
      # correcting the copy, so the next rename cannot fail the same way.
      - name: Package portable
        id: package
        working-directory: .\package
        run: cmd /c build.cmd

      # Inno Setup ships preinstalled on the windows runner image, which package.cmd looks for in
      # the usual locations. This is a separate step from the portable build because package.cmd is
      # what produces the installer, and a single step that ran both would have uploaded a zip and
      # nothing else.
      - name: Package installer
        id: installer
        working-directory: .\package
        run: cmd /c package.cmd

      - uses: actions/upload-artifact@v6
        with:
          name: Kronos-artifacts
          path: |
            ${{ steps.package.outputs.portable }}
            ${{ steps.installer.outputs.installer }}
          if-no-files-found: error
